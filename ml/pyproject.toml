[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "sentimentiq-ml"
version = "0.1.0"
description = "SentimentIQ sentiment analysis interface and analytics"
requires-python = ">=3.10"
dependencies = ["vaderSentiment==3.3.2"]

[project.optional-dependencies]
training = ["scikit-learn>=1.4,<2", "joblib>=1.3", "pandas>=2.0,<4"]
dev = ["pytest>=8,<10"]

[tool.setuptools.packages.find]
where = ["src"]
